_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://Expense_Tracker-backend:9898
    routes:
      - name: auth-route
        paths:
          - "/api/v1/auth"

  - name: user-service
    url: http://Expense_Tracker-backend-2:9810
    routes:
      - name: user-route
        paths:
          - "/api/v1/users"
    plugins:
      - name: custom-auth
        config:
          auth_service_url: http://Expense_Tracker-backend:9898/api/v1/auth/validate

  - name: expense-service
    url: http://Expense_Tracker-expenseService:9820
    routes:
      - name: expense-route
        paths:
          - "/api/v1/expenses"
    plugins:
      - name: custom-auth
        config:
          auth_service_url: http://Expense_Tracker-backend:9898/api/v1/auth/validate